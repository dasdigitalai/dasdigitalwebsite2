<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="t d">
  <title id="t">Illustration of a professional farrier rig</title>
  <desc id="d">A purple pickup truck with an aluminum farrier body. One side compartment is open, showing hammers, rasps and a rack of horseshoes. A gas forge and a swing-out anvil are mounted at the back, and a decal on the side reads Scan to book an appointment, FarriTech, with a QR code.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d18"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7e22ce" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.35" stop-color="#fdba74"/>
      <stop offset="0.7" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7ef"/>
      <stop offset="0.5" stop-color="#c3c7d4"/>
      <stop offset="1" stop-color="#9ca1b3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="tread" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#d6d9e3"/>
      <path d="M2 6 L8 2 M12 16 L18 12" stroke="#a6abbb" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>

