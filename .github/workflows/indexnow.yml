name: IndexNow (notify Bing)

# After each push to main, wait for Vercel to finish deploying,
# then tell Bing/IndexNow which pages exist. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 180
      - name: Check key file is live
        run: curl -fsS https://dasdigitalai.com/9e6cd5d08bb9af3d9ecca97c4d57b5f0.txt
      - name: Submit sitemap URLs
        run: node scripts/indexnow.mjs
